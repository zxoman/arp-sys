<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتبة الواجهات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      ;(function () {
        var root = document.documentElement
        var nav = navigator
        if (nav.hardwareConcurrency <= 4 || nav.deviceMemory <= 4) root.classList.add('low-perf')
        try {
          if (localStorage.getItem('theme') === 'dark') root.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- UI kit showcase (src/kit); served by the dev server at /kit.html. -->
    <script type="module" src="/src/kit-demo.tsx"></script>
  </body>
</html>
