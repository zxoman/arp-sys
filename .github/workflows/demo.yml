name: Demo preview (temporary public URL)

# Runs the whole app — Laravel API + React front-end — inside the job and opens a temporary
# public URL with a Cloudflare quick tunnel. The URL lives as long as the job does (GitHub caps a
# hosted job at 6 hours); starting a new run stops the previous one.
#
# The demo uses SQLite + `DemoSeeder`, never a real database, and the seeded admin is
# admin / password123 — it is a public sandbox, nothing more.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to keep the demo online (minutes, max 350)'
        required: false
        default: '300'

permissions:
  contents: read
  # Publishes the live URL as a deployment so it is readable while the job runs (the job log and
  # the step summary only become available once the run finishes).
  deployments: write

concurrency:
  group: demo-preview
  cancel-in-progress: true

jobs:
  demo:
    name: Run and expose the app
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/demo.sqlite
      APP_ENV: local
      APP_DEBUG: 'false'
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DEMO_MINUTES: ${{ github.event.inputs.duration_minutes || '300' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip, curl
          coverage: none
          # The built-in server recompiles the framework on every request without opcache.
          ini-values: opcache.enable_cli=1

      - name: Set up pnpm and Node 22
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install the API
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force

      - name: Create and seed the demo database
        working-directory: backend
        run: |
          touch database/demo.sqlite
          php artisan migrate --force --seed
          php artisan db:seed --class=DemoSeeder --force

      - name: Install and build the front-end
        working-directory: front
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

      - name: Start the API and the front-end
        working-directory: backend
        env:
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 --no-reload > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          cd ../front
          nohup pnpm run dev -- --host 127.0.0.1 --port 8443 > "$RUNNER_TEMP/front.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/front.pid"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8443/ && curl -s -o /dev/null http://127.0.0.1:8000/api/v1/auth/me; then
              echo "both servers are up"
              exit 0
            fi
            sleep 2
          done
          echo "servers did not start" >&2
          tail -50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/front.log" >&2
          exit 1

      - name: Open the public tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          nohup "$RUNNER_TEMP/cloudflared" tunnel --url http://127.0.0.1:8443 --no-autoupdate > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tunnel.pid"

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "could not read the tunnel URL" >&2
            cat "$RUNNER_TEMP/tunnel.log" >&2
            exit 1
          fi

          echo "URL=$URL" >> "$GITHUB_ENV"
          {
            echo "## 🚀 العرض جاهز"
            echo ""
            echo "**الرابط:** $URL"
            echo ""
            echo "**الدخول:** \`admin\` / \`password123\`"
            echo ""
            echo "ينتهي الرابط بانتهاء هذا التشغيل (${DEMO_MINUTES} دقيقة كحد أقصى 350)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the preview URL as a deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"ref":"'"$GITHUB_REF_NAME"'","environment":"demo-preview","auto_merge":false,"required_contexts":[]}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id' > "$RUNNER_TEMP/deployment.id"
          DEPLOYMENT_ID=$(cat "$RUNNER_TEMP/deployment.id")
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success -f environment_url="$URL" -f description="Temporary demo preview" > /dev/null
          echo "published deployment $DEPLOYMENT_ID → $URL"

      - name: Keep the demo online
        run: |
          echo "Demo: $URL"
          MINUTES=$DEMO_MINUTES
          [ "$MINUTES" -gt 350 ] && MINUTES=350
          END=$(( $(date +%s) + MINUTES * 60 ))

          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$(cat "$RUNNER_TEMP/tunnel.pid")" 2>/dev/null; then
              echo "the tunnel stopped" >&2
              tail -30 "$RUNNER_TEMP/tunnel.log" >&2
              exit 1
            fi
            if ! curl -fsS -o /dev/null http://127.0.0.1:8443/; then
              echo "the front-end stopped answering" >&2
              tail -30 "$RUNNER_TEMP/front.log" >&2
              exit 1
            fi
            sleep 30
          done
          echo "Demo finished after $MINUTES minutes."

      - name: Close the deployment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/deployment.id" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$(cat "$RUNNER_TEMP/deployment.id")/statuses" \
              -f state=inactive -f description="Demo finished" > /dev/null || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/front.log
            ${{ runner.temp }}/tunnel.log
          if-no-files-found: ignore
          retention-days: 3
